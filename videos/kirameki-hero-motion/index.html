<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kirameki Catch — Lunar Pop Hero</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --ink: #100713; --plum: #190a22; --pink: #ff3d9a; --pink-soft: #f8bfd3; --yellow: #ffd36f; --cream: #fff8f0; }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--ink); color: var(--cream); font-family: system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; background: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .stage-background { position: absolute; inset: -3%; background: linear-gradient(90deg, #100713cc 0%, #10071355 48%, #10071388 100%), url('./assets/lunar-pop-stage-bg-v1.webp') center / cover; transform-origin: center; }
      .stage-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 29% 70%, transparent 0 24%, #10071300 45%, #10071380 100%); }
      .stage-frame { position: absolute; inset: 94px 62px 50px; border: 1px solid #ff9dcb4d; pointer-events: none; }
      .orbit { position: absolute; left: -70px; bottom: -490px; width: 1150px; height: 1150px; border: 1px dashed #ff6eb18a; border-radius: 50%; box-shadow: 0 0 0 90px #ff3d9a09, 0 0 0 180px #ff3d9a06; }
      .momo-slot { position: absolute; left: -26px; bottom: -110px; width: 995px; height: 1260px; filter: drop-shadow(0 20px 34px #05020ccc) drop-shadow(0 0 26px #ff3d9a55); }
      .momo-slot img, #happy-reaction img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
      #happy-reaction { position: absolute; left: -3px; bottom: -80px; width: 1015px; height: 1150px; filter: drop-shadow(0 20px 34px #05020ccc) drop-shadow(0 0 34px #ff3d9aaa); transform-origin: 48% 72%; }
      #hero-copy { position: absolute; top: 220px; right: 135px; width: 810px; }
      .kicker { display: flex; align-items: center; gap: 20px; margin: 0 0 38px; color: var(--pink-soft); font-family: system-ui, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: .16em; }
      .kicker b { padding: 12px 16px; color: var(--ink); background: var(--yellow); font-size: 13px; letter-spacing: .19em; }
      .hero-title { margin: 0; font-weight: 900; line-height: .87; letter-spacing: -.08em; }
      .hero-title span { display: block; }
      .hero-title .lead { margin: 0 0 25px 8px; color: var(--pink-soft); font-size: 43px; letter-spacing: .15em; }
      .hero-title .main { color: var(--cream); font-size: 142px; text-shadow: 0 0 28px #ff3d9a66; white-space: nowrap; }
      .rule { width: 484px; height: 2px; margin: 43px 0 26px 10px; background: linear-gradient(90deg, var(--yellow), var(--pink), transparent); transform-origin: left center; }
      .intro { max-width: 510px; margin: 0 0 0 10px; color: #fff8f0cc; font-size: 19px; font-weight: 700; line-height: 1.85; letter-spacing: .04em; }
      #reaction-note { position: absolute; top: 245px; left: 760px; width: 275px; padding: 15px 18px; border: 1px solid #ffd36f99; color: var(--cream); background: #160a20dc; box-shadow: 8px 8px 0 #ff3d9a99; font-size: 17px; font-weight: 800; letter-spacing: .04em; line-height: 1.5; }
      .rabbit-mark { position: absolute; width: 82px; filter: drop-shadow(0 0 16px #ff3d9a99); }
      #rabbit-left { top: 202px; left: 135px; }
      #rabbit-right { right: 142px; bottom: 184px; width: 64px; }
      #enter-lockup { position: absolute; right: 175px; bottom: 112px; display: flex; align-items: center; gap: 20px; color: var(--cream); font-family: system-ui, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: .18em; }
      #enter-lockup b { display: grid; width: 70px; height: 70px; place-items: center; border: 1px solid var(--pink); border-radius: 50%; color: var(--ink); background: var(--yellow); box-shadow: 0 0 25px #ffd36f88; font-size: 30px; }
      .sparkle { position: absolute; color: var(--yellow); font: 900 42px/1 system-ui, sans-serif; text-shadow: 0 0 20px #ffd36fcc; }
      #sparkle-one { top: 142px; left: 720px; }
      #sparkle-two { left: 585px; bottom: 250px; font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="kirameki-hero" data-start="0" data-duration="7" data-fps="30" data-width="1920" data-height="1080">
      <section id="background-clip" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="stage-background" class="stage-background"></div><div class="stage-vignette"></div><div class="stage-frame"></div><div id="orbit" class="orbit" data-layout-allow-overflow="true"></div>
      </section>
      <div id="momo-reveal" class="clip" data-composition-id="particle-image-reveal" data-composition-src="compositions/components/particle-image-reveal.html" data-variable-values='{"density":"med","direction":"center","accent":"violet","exit":"none"}' data-start="0" data-duration="7" data-track-index="1" data-width="1920" data-height="1080" data-layout-allow-overflow="true"></div>
      <section id="reaction-clip" class="clip" data-start="0" data-duration="7" data-track-index="2">
        <div id="happy-reaction"><img src="./assets/momo-moon-rabbit-hero-happy-v2.webp" alt="" /></div><div id="reaction-note">摸摸頭，モモ好開心！</div>
      </section>
      <section id="copy-clip" class="clip" data-start="0" data-duration="7" data-track-index="3">
        <div id="hero-copy"><p id="kicker" class="kicker"><b>LUNAR POP CLUB</b><span>星乃モモ 月兔限定舞台</span></p><h1 class="hero-title"><span id="title-lead" class="lead">今晚，陪伴著你</span><span id="title-main" class="main">月亮偶像</span></h1><div id="title-rule" class="rule"></div><p id="intro" class="intro">戴上兔耳，跟著節拍跳進月亮裡。<br />モモ會把每一次心跳，都變成今夜的光。</p></div>
        <img id="rabbit-left" class="rabbit-mark" src="./assets/rabbit-left.webp" alt="" /><img id="rabbit-right" class="rabbit-mark" src="./assets/rabbit-right.webp" alt="" /><div id="enter-lockup"><span>ENTER THE STAGE</span><b>↓</b></div>
      </section>
      <template data-slot="particle-image-reveal-image"><div class="momo-slot"><img src="./assets/momo-moon-rabbit-hero-v2.webp" alt="" /></div></template>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
      tl.fromTo('#stage-background', { scale: 1.07 }, { scale: 1, duration: 7, ease: 'sine.inOut' }, 0)
        .fromTo('#orbit', { rotation: -10, scale: .88, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 1.45, ease: 'power2.out' }, .12)
        .fromTo('#kicker', { y: 32, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .55 }, .5)
        .fromTo('#title-lead', { y: 34, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .55 }, .82)
        .fromTo('#title-main', { y: 105, scale: .94, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: .82, ease: 'power4.out' }, 1.05)
        .fromTo('#title-rule', { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: .55 }, 1.58)
        .fromTo('#intro', { y: 22, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .5 }, 1.72)
        .fromTo('#rabbit-left', { x: -42, y: 38, rotation: -20, autoAlpha: 0 }, { x: 0, y: 0, rotation: -12, autoAlpha: 1, duration: .7, ease: 'back.out(1.5)' }, 1.35)
        .fromTo('#rabbit-right', { x: 32, y: 34, rotation: 25, autoAlpha: 0 }, { x: 0, y: 0, rotation: 10, autoAlpha: 1, duration: .62, ease: 'back.out(1.5)' }, 1.56)
        .fromTo('#enter-lockup', { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .54 }, 2.12)
        .fromTo('#happy-reaction', { y: 80, scale: .79, rotation: -4, autoAlpha: 0 }, { y: 0, scale: 1, rotation: 0, autoAlpha: 1, duration: .5, ease: 'back.out(1.9)' }, 4.3)
        .to('#happy-reaction', { y: -16, duration: .16, ease: 'power2.out' }, 4.84).to('#happy-reaction', { y: 0, duration: .25, ease: 'bounce.out' }, 5)
        .fromTo('#reaction-note', { x: -28, y: 16, scale: .86, autoAlpha: 0 }, { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: .38, ease: 'back.out(1.6)' }, 4.62)
        .to('#enter-lockup b', { scale: 1.08, duration: .24, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 5.1);
      window.__timelines = window.__timelines || {};
      window.__timelines['kirameki-hero'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
